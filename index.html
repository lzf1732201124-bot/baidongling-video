<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07477e">
  <meta name="description" content="山东财经大学财政税务学院 白东灵 202602340301">
  <title>白东灵｜山东财经大学财政税务学院</title>
  <style>
    :root { color-scheme:light; --blue:#07477e; --ink:#172b3c; --muted:#526879; --paper:#ffffff; --background:#f2f6fa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; color:var(--ink); background:var(--background); font-family:"Source Han Sans CN","思源黑体 CN","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(100%,680px); margin:0 auto; padding:28px 24px 30px; }
    header { display:flex; align-items:center; gap:15px; margin-bottom:25px; }
    header img { width:66px; height:66px; flex:none; border-radius:50%; }
    .school { margin:0 0 5px; color:var(--blue); font-size:21px; font-weight:700; letter-spacing:.03em; }
    .college { margin:0; font-size:16px; line-height:1.5; color:var(--muted); }
    .identity { display:flex; justify-content:space-between; align-items:center; gap:18px; margin:0 0 20px; }
    h1 { margin:0; font-size:30px; line-height:1.4; letter-spacing:.08em; }
    .number { margin:0; color:var(--muted); font-size:14px; line-height:1.7; text-align:right; }
    .number span { display:block; font-size:16px; color:var(--ink); font-variant-numeric:tabular-nums; }
    .player { display:flex; justify-content:center; background:#000; border-radius:12px; overflow:hidden; }
    video { display:block; width:100%; max-height:66svh; aspect-ratio:9/16; object-fit:contain; background:#000; }
    .hint { margin:12px 0 0; color:var(--muted); text-align:center; font-size:13px; line-height:1.6; }
    .fallback { display:none; padding:16px 0; color:var(--ink); font-size:15px; line-height:1.7; }
    a { color:var(--blue); text-underline-offset:4px; }
    a:focus-visible,video:focus-visible { outline:3px solid #e49821; outline-offset:5px; }
    footer { padding-top:24px; text-align:center; color:var(--muted); font-size:12px; }
    @media(min-width:600px) { main { margin:28px auto; padding:32px 38px; background:var(--paper); border-radius:18px; } video { max-height:65svh; } }
    @media(max-width:360px) { main { padding:22px 18px; } header img { width:56px;height:56px; } .school { font-size:19px; } h1 { font-size:27px; } .number span { font-size:14px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="sdufe-emblem.jpg" alt="山东财经大学校徽" width="66" height="66">
      <div><p class="school">山东财经大学</p><p class="college">财政税务学院</p></div>
    </header>
    <section aria-label="学生信息" class="identity">
      <h1>白东灵</h1>
      <p class="number">学号<span>202602340301</span></p>
    </section>
    <div class="player">
      <video id="video" controls autoplay muted loop playsinline webkit-playsinline preload="metadata" poster="poster.jpg" aria-label="白东灵的视频">
        <source src="video.mp4" type="video/mp4">
        你的浏览器暂不支持视频播放，可<a href="video.mp4">打开视频</a>观看。
      </video>
    </div>
    <p class="hint">点击视频可播放、暂停或开启声音</p>
    <p class="fallback" id="fallback" role="status">视频暂时未能加载，请稍后刷新，或<a href="video.mp4">直接打开视频</a>。</p>
    <footer>课程作业展示</footer>
  </main>
  <script>
    const video = document.getElementById('video');
    const fallback = document.getElementById('fallback');
    video.addEventListener('error', () => { fallback.style.display = 'block'; });
    video.querySelector('source').addEventListener('error', () => { fallback.style.display = 'block'; });
  </script>
</body>
</html>
